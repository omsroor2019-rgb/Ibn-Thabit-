name: Bin Thabit Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bin-thabit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. تحميل ملفات المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # 4. إعداد مستودعات Gradle لحل مشكلة Kotlin
      - name: Configure Gradle plugin repositories
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"

          mkdir -p "$GRADLE_USER_HOME/init.d"

          cat > "$GRADLE_USER_HOME/init.d/00-flutter-plugin-repositories.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          GRADLE

          echo "Gradle plugin repositories configured."

      # 5. إنشاء ملفات منصة Android
      - name: Generate Android platform files
        shell: bash
        run: |
          set -euo pipefail
          bash tool/prepare_android.sh

      # 6. التحقق من قاعدة البيانات والقيود المالية
      - name: Verify SQLite schema
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_schema.py

      # 7. تحميل مكتبات المشروع
      - name: Install Flutter dependencies
        run: flutter pub get

      # 8. إنشاء أيقونة التطبيق
      - name: Generate application launcher icon
        run: dart run flutter_launcher_icons

      # 9. التحقق من إصدار أدوات Android وGradle
      - name: Check Android build tools
        shell: bash
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew
          ./gradlew --version

      # 10. فحص كود Dart
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      # 11. تشغيل الاختبارات
      - name: Run Flutter tests
        run: flutter test --reporter expanded

      # 12. بناء نسخة APK النهائية
      - name: Build release APK
        run: flutter build apk --release

      # 13. حفظ ملف APK
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bin-thabit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
