name: Bin Thabit Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bin-thabit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      # The Flutter Gradle plugin is an included build. Its plugin resolution
      # was searching only Gradle Plugin Portal for Kotlin artifacts. Add
      # Maven Central BEFORE settings scripts and plugin blocks are evaluated.
      - name: Configure Gradle plugin repositories
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/00-flutter-plugin-repositories.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          GRADLE
          echo "Added Google Maven Central and Gradle Plugin Portal to plugin resolution for all builds, including Flutter's included Gradle build."

      - name: Generate Android platform files
        run: bash tool/prepare_android.sh

      - name: Verify SQLite schema and financial constraints
        run: python3 tool/verify_schema.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate application launcher icon
        run: dart run flutter_launcher_icons

      - name: Show Android build tool versions
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bin-thabit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
