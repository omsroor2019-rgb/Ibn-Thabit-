name: Extract Bin Thabit project archive

on:
  workflow_dispatch:
  push:
    paths:
      - 'bin_thabit_reviewed.zip'
      - 'bin_thabit_flutter_source.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and safely extract project archive
        shell: bash
        run: |
          set -euo pipefail
          archive=''
          if [[ -f bin_thabit_reviewed.zip ]]; then
            archive='bin_thabit_reviewed.zip'
          elif [[ -f bin_thabit_flutter_source.zip ]]; then
            archive='bin_thabit_flutter_source.zip'
          else
            echo 'No supported Bin Thabit ZIP found at repository root.' >&2
            exit 1
          fi

          mkdir -p .extract_tmp
          python3 - "$archive" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          root = pathlib.Path('.extract_tmp').resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  target = (root / info.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe ZIP path: {info.filename}')
              z.extractall(root)
          PY

          # The supplied archive contains a single top-level bin_thabit/ folder.
          src='.extract_tmp/bin_thabit'
          test -d "$src"
          cp -a "$src"/. .
          rm -rf .extract_tmp "$archive"

      - name: Commit extracted project files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit.'
          else
            git commit -m 'Extract Bin Thabit Flutter project'
            git push
          fi
