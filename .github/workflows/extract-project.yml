name: Extract Bin Thabit Flutter project

on:
  push:
    branches:
      - main
    paths:
      - 'bin_thabit_reviewed.zip'
      - 'bin_thabit_flutter_source.zip'
      - '.github/workflows/extract-project.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bin-thabit-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Extract project files into repository root
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safely extract Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f bin_thabit_reviewed.zip ]]; then
            ARCHIVE="bin_thabit_reviewed.zip"
          elif [[ -f bin_thabit_flutter_source.zip ]]; then
            ARCHIVE="bin_thabit_flutter_source.zip"
          else
            echo "ERROR: No supported project ZIP found in repository root." >&2
            exit 1
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          python3 - "$ARCHIVE" "$TEMP_DIR" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          max_files = 2500
          max_uncompressed = 250 * 1024 * 1024

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > max_files:
                  raise SystemExit(f"Too many ZIP entries: {len(entries)}")

              total_size = 0
              paths = []
              for info in entries:
                  name = info.filename.replace('\\', '/')
                  path = pathlib.PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or not path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  if path.parts[0] == '.git':
                      raise SystemExit("ZIP must not contain a .git directory")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {info.filename}")
                  total_size += info.file_size
                  if total_size > max_uncompressed:
                      raise SystemExit("ZIP exceeds 250 MiB uncompressed limit")
                  paths.append(path)

              roots = {str(p.parent) for p in paths if p.name == 'pubspec.yaml'}
              if len(roots) != 1:
                  raise SystemExit(f"Expected exactly one pubspec.yaml, found: {sorted(roots)}")

              project_root = next(iter(roots))
              for path in paths:
                  target = (destination / pathlib.Path(*path.parts)).resolve()
                  if destination != target and destination not in target.parents:
                      raise SystemExit(f"ZIP path escapes destination: {path}")

              zf.extractall(destination)

          project = destination if project_root == '.' else destination / project_root
          for required in (project / 'pubspec.yaml', project / 'lib' / 'main.dart'):
              if not required.is_file():
                  raise SystemExit(f"Missing required Flutter file: {required}")

          print(f"Flutter project located at: {project}")
          PY

          PROJECT_ROOT="$(find "$TEMP_DIR" -name pubspec.yaml -type f -print -quit | xargs dirname)"
          test -f "$PROJECT_ROOT/lib/main.dart"

          # IMPORTANT: Do not copy .github/workflows from the ZIP.
          # The token used by this workflow can push source files but cannot
          # create/update workflow files. Add android.yml once manually in GitHub UI.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT_ROOT/" ./

          test -f pubspec.yaml
          test -f lib/main.dart
          rm -f "$ARCHIVE"
          echo "Flutter source files extracted. GitHub workflow files were intentionally excluded."

      - name: Commit extracted source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Guard: never push a change to a workflow file with GITHUB_TOKEN.
          if ! git diff --cached --name-only | grep -qv '^\.github/workflows/'; then
            echo "No non-workflow source changes were staged; stopping safely."
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing to push workflow-file changes with the default token." >&2
            exit 1
          fi

          git commit -m "Extract Bin Thabit Flutter source"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify extracted source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android || echo "Android platform folder will be generated by the Android build workflow."
          echo "Flutter project files are present at repository root."
